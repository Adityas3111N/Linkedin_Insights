version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: linkedin_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: linkedin_insights
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: linkedin_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/linkedin_insights
      - APP_ENV=production
      - APP_DEBUG=False
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
